name: Release

# Push a tag like v0.1.0 to build Linux binaries and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Package
        run: |
          name="meridian-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$name/tools" "$name/assets/icons" "$name/assets/fonts"
          cp target/release/meridian LICENSE README.md "$name/"
          cp tools/install.sh "$name/tools/"
          cp assets/meridian.desktop "$name/assets/"
          cp assets/icons/meridian.svg "$name/assets/icons/"
          cp assets/fonts/*LICENSE* "$name/assets/fonts/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            meridian-*.tar.gz
            meridian-*.tar.gz.sha256
          generate_release_notes: true
