[package]
name = "meridian"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A fast, keyboard-first, offline Kanban board"
license = "MIT"
authors = ["Hayk Sahakyan"]
readme = "README.md"
repository = "https://github.com/ShaderCompilation/Meridian"
keywords = ["kanban", "todo", "tasks", "productivity", "iced"]
categories = ["gui"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "smol", "linux-theme-detection", "x11", "wayland", "advanced"] }
nucleo-matcher = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
